<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monument Information Finder</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f4f4f4;
    }
    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    #result {
      margin-top: 20px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Search Historical Monument Info</h2>
    <input type="text" id="monumentName" placeholder="Enter Monument Name" />
    <button onclick="getMonumentInfo()">Get Info</button>
    <div id="result"></div>
  </div>

  <script>
    async function getMonumentInfo() {
      const monument = document.getElementById("monumentName").value.trim();
      const resultDiv = document.getElementById("result");
      resultDiv.innerHTML = "Loading...";

      if (!monument) {
        resultDiv.innerHTML = "Please enter a monument name.";
        return;
      }

      const keywords = ["fort", "temple", "palace", "tomb", "monument", "mosque", "museum"];
      const isHistorical = keywords.some(keyword =>
        monument.toLowerCase().includes(keyword)
      );

      if (!isHistorical) {
        resultDiv.innerHTML = "Please enter a valid historical monument name.";
        return;
      }

      try {
        const response = await fetch(`https://corsproxy.io/?https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(monument)}`);
        const data = await response.json();

        if (data.extract) {
          resultDiv.innerHTML = `
            <h3>${data.title}</h3>
            <p>${data.extract}</p>
            <a href="${data.content_urls.desktop.page}" target="_blank">Read more on Wikipedia</a>
          `;
        } else {
          resultDiv.innerHTML = "No information found. Please try another name.";
        }
      } catch (error) {
        resultDiv.innerHTML = "Error fetching data. Please try again later.";
        console.error(error);
      }
    }
  </script>
</body>
</html>
